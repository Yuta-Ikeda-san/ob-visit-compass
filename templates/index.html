<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>OB訪問コンパス</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            background: linear-gradient(135deg, #eef2f7, #dce6f0);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .app {
            width: 100%;
            max-width: 640px;
            background: #fff;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: linear-gradient(135deg, #2c5aa0, #1e3f73);
            color: white;
            padding: 18px 20px;
        }
        header h1 { margin: 0; font-size: 20px; }
        header p { margin: 4px 0 0; font-size: 13px; opacity: 0.85; }
        header a {
            color: #dbe8ff;
            font-size: 13px;
            text-decoration: underline;
        }
        .chat-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
            font-size: 14px;
        }
        .agent {
            background: #eef1f6;
            color: #222;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .user {
            background: #2c5aa0;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .loading {
            align-self: flex-start;
            color: #888;
            font-size: 13px;
            font-style: italic;
        }
        form {
            display: flex;
            padding: 14px;
            border-top: 1px solid #eee;
            gap: 8px;
        }
        textarea {
            flex: 1;
            resize: none;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 14px;
            font-family: inherit;
        }
        button {
            background: #2c5aa0;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover { background: #1e3f73; }
        button:disabled { background: #aaa; cursor: not-allowed; }
    </style>
</head>
<body>
<div class="app">
    <header>
        <h1>OB訪問コンパス</h1>
        <p>業界・職種を教えてください。OB訪問で聞くべき質問をAgentが一緒に考えます。</p>
        <a href="/history">📋 相談履歴を見る</a>
    </header>

    <div class="chat-area" id="chatArea">
        <div class="bubble agent">
            こんにちは！OB訪問の準備をお手伝いします。<br>
            まずは興味のある業界や、今悩んでいることを教えてください。
        </div>
    </div>

    <form id="chatForm">
        <textarea id="messageInput" rows="1" placeholder="メッセージを入力..." required></textarea>
        <button type="submit" id="sendBtn">送信</button>
    </form>
</div>

<script>
const chatArea = document.getElementById("chatArea");
const form = document.getElementById("chatForm");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");

function addBubble(role, text) {
    const div = document.createElement("div");
    div.className = "bubble " + role;
    div.innerText = text;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
}

function addLoading() {
    const div = document.createElement("div");
    div.className = "loading";
    div.id = "loadingIndicator";
    div.innerText = "Agentが考えています...";
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
}

function removeLoading() {
    const el = document.getElementById("loadingIndicator");
    if (el) el.remove();
}

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;

    addBubble("user", message);
    input.value = "";
    sendBtn.disabled = true;
    addLoading();

    try {
        const res = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: "message=" + encodeURIComponent(message)
        });
        const data = await res.json();
        removeLoading();
        addBubble("agent", data.reply);
    } catch (err) {
        removeLoading();
        addBubble("agent", "エラーが発生しました。もう一度お試しください。");
    }

    sendBtn.disabled = false;
});
</script>
</body>
</html>
